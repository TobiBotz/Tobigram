    sendPoll:
      question_entities: carried by question, which accepts a FormattedText holding the entities and parse mode
      question_parse_mode: carried by question, which accepts a FormattedText holding the entities and parse mode
      description_entities: carried by description, which accepts a FormattedText holding the entities and parse mode
      description_parse_mode: carried by description, which accepts a FormattedText holding the entities and parse mode
    sendVenue:
      google_place_id: >-
        MTProto keeps one provider-agnostic venue id, sent as foursquare_id
      google_place_type: >-
        MTProto keeps one provider-agnostic venue type, sent as foursquare_type
    restrictChatMember:
      use_independent_chat_permissions: >-
        chatBannedRights has no grouping flag, so every permission is always
        independent
    "*":
      receiver_user_id: >-
        no TL field at layer 228; sending on another user's behalf is a Bot API
        only concept
      callback_query_id: >-
        no TL field at layer 228; answering a callback query with a new message
        is a Bot API only concept
    setChatPermissions:
      use_independent_chat_permissions: >-
        chatBannedRights has no grouping flag, so every permission is always
        independent
    promoteChatMember:
      is_anonymous: folded into the privileges argument
      can_manage_chat: folded into the privileges argument
      can_delete_messages: folded into the privileges argument
      can_manage_video_chats: folded into the privileges argument
      can_restrict_members: folded into the privileges argument
