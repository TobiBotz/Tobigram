    editMessageReplyMarkup:
      inline_message_id: editing a message sent as an inline query result goes through edit_inline_reply_markup, which takes the inline_message_id
    editEphemeralMessageText:
      link_preview_options: >-
        ephemeral.editMessage has no no_webpage field, so a link preview cannot be
        turned off any more than send_ephemeral_message can turn one off
    unbanChatMember:
      only_if_banned: >-
        channels.editBanned has no such flag; MTProto clears the restrictions
        whether or not the user was banned
    transferGift:
      star_count: >-
        payments.transferStarGift takes no fee argument; the cost is fixed by the
        gift itself
    sendSticker:
