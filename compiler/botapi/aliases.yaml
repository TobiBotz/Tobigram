      has_hidden_members: is_members_hidden
      max_reaction_count: reactions_limit
      personal_chat: personal_channel

  field_unsupported:
    Gift:
      total_count: carried by overall_limits, which pairs it with the remaining count
      remaining_count: carried by overall_limits
      personal_total_count: carried by user_limits, the per-user purchase limit
      personal_remaining_count: carried by user_limits
    Game:
      text: >-
        the game TL constructor carries no text; Bot API takes it from the
        message the game is attached to
      text_entities: >-
        the game TL constructor carries no text, so it carries no entities either
    LivePhoto:
      photo: >-
        wzgram models the moving half of a live photo, which MTProto sends as a
        document; the still frame arrives as the message's own photo
    SuggestedPostPrice:
      amount: >-
        wzgram keeps one class per currency, SuggestedPostPriceStar and
        SuggestedPostPriceTon, each with its own amount
      currency: implied by the class, SuggestedPostPriceStar or SuggestedPostPriceTon
    ChatBoost:
      source: >-
        the boost origin is flattened into is_gift, is_giveaway and from_user
    SuggestedPostPaid:
      currency: >-
        implied by which amount is set, star_amount for Stars and amount for TON
    ChecklistTask:
      completed_by_chat: completed_by carries whoever completed the task
      completed_by_user: completed_by carries whoever completed the task
    Venue:
      google_place_id: >-
        MTProto keeps one provider-agnostic venue id, surfaced as foursquare_id
      google_place_type: >-
        MTProto keeps one provider-agnostic venue type, surfaced as foursquare_type
    Poll:
      question_entities: carried by question, which is a FormattedText and holds the entities
      description_entities: carried by description, which is a FormattedText and holds the entities
      explanation_entities: carried by explanation, which is a FormattedText and holds the entities
    PollOption:
      text_entities: carried by text, which is a FormattedText and holds the entities
    InputPollOption:
      text_entities: carried by text, which is a FormattedText and holds the entities
      text_parse_mode: text accepts a FormattedText, which carries the parse mode
    PollOptionAdded:
      option_text_entities: carried by text, which is a FormattedText and holds the entities
    PollOptionDeleted:
      option_text_entities: carried by text, which is a FormattedText and holds the entities
    InputMediaPhoto:
      show_caption_above_media: >-
        inputSingleMedia has no invert_media flag, so MTProto places the caption
        per message rather than per album item; send_media_group takes it
    InputMediaVideo:
      show_caption_above_media: >-
        inputSingleMedia has no invert_media flag; send_media_group takes it
    InputMediaAnimation:
      show_caption_above_media: >-
        inputSingleMedia has no invert_media flag; send_media_group takes it
    ChatShared:
      photo: carried by chat
      title: carried by chat
      username: carried by chat
    ForceReply:
      force_reply: the class itself is the marker, so there is nothing to carry
    ReplyKeyboardRemove:
      remove_keyboard: the class itself is the marker, so there is nothing to carry
    ReplyParameters:
      allow_sending_without_reply: >-
        MTProto always sends when the replied-to message is gone, so there is
        nothing to opt into
    User:
      supports_inline_queries: >-
        inline_query_placeholder is set only for bots that accept inline queries
    Message:
      passport_data: Telegram Passport is not implemented; no SecureValue type exists
    ChatFullInfo:
      accent_color_id: carried by reply_color, which pairs it with its background emoji
      background_custom_emoji_id: carried by reply_color
      profile_accent_color_id: carried by profile_color
      profile_background_custom_emoji_id: carried by profile_color
      emoji_status_custom_emoji_id: carried by emoji_status
      emoji_status_expiration_date: carried by emoji_status
      has_private_forwards: private_forward_name carries the name, and its presence implies this
      has_restricted_voice_and_video_messages: can_send_voice_messages is the same flag, inverted
      unique_gift_colors: no MTProto equivalent; the TL schema has no gift colour scheme
    "*":
      type: >-
        Bot API discriminates union members with a type string; wzgram uses a
        distinct class per member, or an enum, so there is nothing to carry

  method_field_rename:
