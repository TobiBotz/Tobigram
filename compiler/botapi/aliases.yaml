# Bot API and MTProto name reconciliation.
#
# rename:      the spec calls it X, wzgram calls it Y
# unsupported: the spec has it, wzgram deliberately does not, with the reason
#
# Lookup order is entity, then raw function (MTProto only), then "*".

botapi:
  type_rename:
    PhotoSize: Thumbnail
    Birthdate: Birthday
    PaidMessagePriceChanged: PaidMessagesPriceChanged
    ReactionType: Reaction
    ChatFullInfo: Chat

  type_unsupported:
    Update: MTProto pushes parsed updates straight to handlers; there is no Update object
    WebhookInfo: webhooks are a Bot API transport and do not exist over MTProto
    MessageId: send_* return a full Message, not a bare identifier
    InaccessibleMessage: MTProto always delivers the message itself
    MaybeInaccessibleMessage: union of Message and InaccessibleMessage, neither modelled
    ResponseParameters: MTProto surfaces these as typed RPCError subclasses
    InputFile: uploads take a path or a file object directly, with no wrapper type

  method_rename: {}

  method_unsupported:
    getUpdates: long polling is a Bot API transport; MTProto pushes updates
    setWebhook: webhooks do not exist over MTProto
    deleteWebhook: webhooks do not exist over MTProto
    getWebhookInfo: webhooks do not exist over MTProto

  field_rename:
    "*":
      from: from_user
      thumbnail: thumbs
    Message:
      message_id: id
    MessageEntity:
      is_expandable: expandable
    Message:
      boost_added: chat_boost
      chat_background_set: chat_set_background
      direct_messages_topic: direct_messages_topic_id
      gift_upgrade_sent: gift
      is_automatic_forward: automatic_forward
      is_from_offline: from_offline
      message_auto_delete_timer_changed: set_message_auto_delete_time
      paid_message_price_changed: paid_messages_price_changed
      paid_star_count: send_paid_messages_stars
      unique_gift: gift
      video_chat_participants_invited: video_chat_members_invited
    ChatFullInfo:
      active_usernames: usernames
      birthdate: birthday
      business_opening_hours: business_work_hours
      has_hidden_members: is_members_hidden
      max_reaction_count: reactions_limit
      personal_chat: personal_channel

  field_unsupported:
    Message:
      passport_data: Telegram Passport is not implemented; no SecureValue type exists
    ChatFullInfo:
      accent_color_id: carried by reply_color, which pairs it with its background emoji
      background_custom_emoji_id: carried by reply_color
      profile_accent_color_id: carried by profile_color
      profile_background_custom_emoji_id: carried by profile_color
      emoji_status_custom_emoji_id: carried by emoji_status
      emoji_status_expiration_date: carried by emoji_status
      has_private_forwards: private_forward_name carries the name, and its presence implies this
      has_restricted_voice_and_video_messages: can_send_voice_messages is the same flag, inverted
      unique_gift_colors: no MTProto equivalent; the TL schema has no gift colour scheme
    "*":
      type: >-
        Bot API discriminates union members with a type string; wzgram uses a
        distinct class per member, or an enum, so there is nothing to carry

  method_field_rename:
    "*":
      message_effect_id: effect_id
      rich_message: rich_text

  method_field_unsupported:
    promoteChatMember:
      is_anonymous: folded into the privileges argument
      can_manage_chat: folded into the privileges argument
      can_delete_messages: folded into the privileges argument
      can_manage_video_chats: folded into the privileges argument
      can_restrict_members: folded into the privileges argument
      can_promote_members: folded into the privileges argument
      can_change_info: folded into the privileges argument
      can_invite_users: folded into the privileges argument
      can_post_messages: folded into the privileges argument
      can_edit_messages: folded into the privileges argument
      can_pin_messages: folded into the privileges argument
      can_post_stories: folded into the privileges argument
      can_edit_stories: folded into the privileges argument
      can_delete_stories: folded into the privileges argument
      can_manage_topics: folded into the privileges argument
      can_manage_direct_messages: folded into the privileges argument
      can_manage_tags: folded into the privileges argument

mtproto:
  internal:
    - flags
    - flags2
    - random_id
    - hash

  raw_function: {}

  field_rename:
    "*":
      peer: chat_id
      message: text
      silent: disable_notification
      no_webpage: disable_web_page_preview
      noforwards: protect_content
      invert_media: show_caption_above_media
      allow_paid_floodskip: allow_paid_broadcast
      reply_to: reply_parameters
      reply_to_msg_id: reply_to_message_id
      top_msg_id: message_thread_id
      effect: effect_id
      allow_paid_stars: paid_message_star_count
      schedule_repeat_period: repeat_period
      suggested_post: suggested_post_parameters

    messages.sendMedia:
      message: caption
      entities: caption_entities

    messages.sendMultiMedia:
      message: caption
      entities: caption_entities

    messages.editMessage:
      id: message_id

    messages.exportChatInvite:
      title: name
      usage_limit: member_limit
      request_needed: creates_join_request

    messages.editExportedChatInvite:
      link: invite_link
      title: name
      usage_limit: member_limit
      request_needed: creates_join_request

    messages.forwardMessages:
      from_peer: from_chat_id
      to_peer: chat_id
      id: message_ids
      drop_author: hide_sender_name
      drop_media_captions: hide_captions
      video_timestamp: video_start_timestamp

  field_unsupported:
    export_chat_invite_link:
      title: creating a named link goes through create_chat_invite_link
      usage_limit: creating a limited link goes through create_chat_invite_link
      request_needed: creating an approval link goes through create_chat_invite_link
      expire_date: creating an expiring link goes through create_chat_invite_link
    revoke_chat_invite_link:
      title: revoking does not edit the link; use edit_chat_invite_link
      usage_limit: revoking does not edit the link; use edit_chat_invite_link
      request_needed: revoking does not edit the link; use edit_chat_invite_link
      expire_date: revoking does not edit the link; use edit_chat_invite_link
      revoked: set by the method, which exists to revoke
    edit_chat_invite_link:
      revoked: revoking goes through revoke_chat_invite_link
    send_rich_message:
      message: the message is passed as rich_text
      entities: the message is passed as rich_text
      rich_message: the message is passed as rich_text
    send_checklist:
      message: the method builds its own content from its arguments
      entities: the method builds its own content from its arguments
    send_contact:
      message: the method builds its own content from its arguments
      entities: the method builds its own content from its arguments
    send_dice:
      message: the method builds its own content from its arguments
      entities: the method builds its own content from its arguments
    send_location:
      message: the method builds its own content from its arguments
      entities: the method builds its own content from its arguments
    send_poll:
      message: the method builds its own content from its arguments
      entities: the method builds its own content from its arguments
    send_sticker:
      message: the method builds its own content from its arguments
      entities: the method builds its own content from its arguments
    send_venue:
      message: the method builds its own content from its arguments
      entities: the method builds its own content from its arguments
    send_video_note:
      message: the method builds its own content from its arguments
      entities: the method builds its own content from its arguments
    send_game:
      message: the method builds its own content from its arguments
      entities: the method builds its own content from its arguments
      invert_media: the method sends no caption, so there is nothing to place above the media
    send_invoice:
      invert_media: the method sends no caption, so there is nothing to place above the media
    edit_message_text:
      media: edits the text; media is replaced through edit_message_media
      rich_message: rich text is passed as rich_text
    edit_message_reply_markup:
      message: the method builds its own content from its arguments
      entities: the method builds its own content from its arguments
      media: the method builds its own content from its arguments
      rich_message: the method builds its own content from its arguments
      no_webpage: the method builds its own content from its arguments
      invert_media: the method builds its own content from its arguments
    stop_poll:
      message: the method builds its own content from its arguments
      entities: the method builds its own content from its arguments
      media: the method builds its own content from its arguments
      rich_message: the method builds its own content from its arguments
      no_webpage: the method builds its own content from its arguments
      invert_media: the method builds its own content from its arguments
    edit_message_checklist:
      message: the method builds its own content from its arguments
      entities: the method builds its own content from its arguments
      media: the method builds its own content from its arguments
      rich_message: the method builds its own content from its arguments
      no_webpage: the method builds its own content from its arguments
      invert_media: the method builds its own content from its arguments
    messages.sendMedia:
      media: the sending method builds the media from its own arguments
    messages.sendMultiMedia:
      multi_media: the sending method builds the media from its own arguments
